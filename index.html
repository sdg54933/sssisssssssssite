
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Servo Remote</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: white;
      font-family: -apple-system, sans-serif;
    }
    main {
      width: min(88%, 360px);
      text-align: center;
    }
    h1 { font-size: 28px; }
    p { color: #aaa; }
    button {
      width: 100%;
      padding: 18px;
      margin-top: 12px;
      border: 0;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    #connect { background: #fff; color: #111; }
    #go { background: #72e6a0; color: #111; }
    button:disabled { opacity: .35; }
    #status {
      min-height: 48px;
      margin-top: 22px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<main>
  <h1>Servo Remote</h1>
  <p>ESP32 Bluetooth Controller</p>

  <button id="connect">블루투스 연결</button>
  <button id="go" disabled>GO · 서보 작동</button>
  <div id="status">기기 확인 중...</div>
</main>

<script>
const SERVICE_UUID =
  '12345678-1234-1234-1234-1234567890ab';

const CHARACTERISTIC_UUID =
  'abcdefab-1234-1234-1234-abcdefabcdef';

let device = null;
let characteristic = null;
let connecting = false;

const status = document.getElementById('status');
const connectButton = document.getElementById('connect');
const goButton = document.getElementById('go');

function setDisconnected(message = '연결되지 않음') {
  characteristic = null;
  goButton.disabled = true;
  status.textContent = message;
}

async function connectDevice(selectedDevice) {
  if (connecting) return;

  connecting = true;
  connectButton.disabled = true;
  status.textContent = '연결 중...';

  try {
    device = selectedDevice;

    device.removeEventListener(
      'gattserverdisconnected', onDisconnected
    );
    device.addEventListener(
      'gattserverdisconnected', onDisconnected
    );

    const server = device.gatt.connected
      ? device.gatt
      : await device.gatt.connect();

    const service = await server.getPrimaryService(SERVICE_UUID);
    characteristic =
      await service.getCharacteristic(CHARACTERISTIC_UUID);

    goButton.disabled = false;
    status.textContent = '연결됨: ' + device.name;
  } catch (error) {
    setDisconnected('연결 실패: ' + error.message);
  } finally {
    connecting = false;
    connectButton.disabled = false;
  }
}

function onDisconnected() {
  setDisconnected('연결 끊김 · 다시 연결해 줘');
}

connectButton.addEventListener('click', async () => {
  try {
    if (!navigator.bluetooth) {
      status.textContent =
        'Web Bluetooth를 사용할 수 없어. beacio 확장을 확인해 줘.';
      return;
    }

    status.textContent = '블루투스 기기 검색 중...';

    const selectedDevice =
      await navigator.bluetooth.requestDevice({
        filters: [{ name: 'ServoESP32' }],
        optionalServices: [SERVICE_UUID]
      });

    await connectDevice(selectedDevice);
  } catch (error) {
    status.textContent = '연결 실패: ' + error.message;
  }
});

goButton.addEventListener('click', async () => {
  if (!characteristic) return;

  try {
    const data = new TextEncoder().encode('GO');
    await characteristic.writeValueWithResponse(data);
    status.textContent = 'GO 전송 완료!';
  } catch (error) {
    setDisconnected('전송 실패: ' + error.message);
  }
});

async function restorePreviousDevice() {
  try {
    if (!navigator.bluetooth ||
        typeof navigator.bluetooth.getDevices !== 'function') {
      status.textContent = '처음 연결은 연결 버튼을 눌러 줘.';
      return;
    }

    const devices = await navigator.bluetooth.getDevices();
    const previousDevice =
      devices.find(item => item.name === 'ServoESP32');

    if (!previousDevice) {
      status.textContent = '처음 연결은 연결 버튼을 눌러 줘.';
      return;
    }

    await connectDevice(previousDevice);
  } catch (error) {
    setDisconnected('자동 재연결 실패 · 연결 버튼을 눌러 줘');
  }
}

restorePreviousDevice();
</script>
</body>
</html>
